
<style>
.sd-wrap { font-family: var(--font-sans); padding: 0 0 8px; }
.sd-title { font-size: 13px; font-weight: 500; color: var(--color-text-primary); text-align: center; padding: 12px 0 4px; }
.sd-legend { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; padding: 8px 0 2px; }
.sd-legend-item { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--color-text-secondary); }
.sd-legend-line { width: 32px; height: 2px; }
.sd-legend-line.req { background: #1D9E75; }
.sd-legend-line.res { background: var(--color-border-secondary); border-top: 2px dashed var(--color-border-primary); height: 0; }
.sd-legend-line.err { background: #E24B4A; }
.sd-legend-line.db  { background: #BA7517; }
.sd-section-label { font-size: 11px; color: var(--color-text-tertiary); font-style: italic; }
</style>

<div class="sd-wrap">
<div class="sd-title">Inscription &amp; connexion — US 7</div>

<svg width="100%" viewBox="0 0 680 460" role="img">
<title>Diagramme de séquence — Inscription et connexion EcoRide</title>
<desc>Flux US7 : inscription avec hash bcrypt, génération JWT, et connexion avec gestion d'erreur 401</desc>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Acteur boxes — x positions: Navigateur=90, API=330, Supabase=570 -->
<g class="c-teal"><rect x="30" y="8" width="120" height="34" rx="6" stroke-width="0.5"/><text class="th" x="90" y="25" text-anchor="middle" dominant-baseline="central">Navigateur</text></g>
<g class="c-purple"><rect x="270" y="8" width="120" height="34" rx="6" stroke-width="0.5"/><text class="th" x="330" y="25" text-anchor="middle" dominant-baseline="central">API Express</text></g>
<g class="c-amber"><rect x="510" y="8" width="120" height="34" rx="6" stroke-width="0.5"/><text class="th" x="570" y="25" text-anchor="middle" dominant-baseline="central">Supabase</text></g>

<!-- Lifelines -->
<line x1="90" y1="42" x2="90" y2="450" stroke="var(--color-border-secondary)" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="330" y1="42" x2="330" y2="450" stroke="var(--color-border-secondary)" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="570" y1="42" x2="570" y2="450" stroke="var(--color-border-secondary)" stroke-width="1" stroke-dasharray="4 3"/>

<!-- ── INSCRIPTION ── -->
<rect x="8" y="58" width="64" height="16" rx="3" fill="var(--color-background-secondary)" stroke="var(--color-border-tertiary)" stroke-width="0.5"/>
<text class="sd-section-label" x="40" y="69" text-anchor="middle" dominant-baseline="central" style="font-size:11px;fill:var(--color-text-tertiary)">Inscription</text>

<!-- 1 POST /auth/register -->
<line x1="90" y1="88" x2="322" y2="88" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="100" y="77" width="220" height="14" rx="2" fill="var(--color-background-primary)"/>
<text class="ts" x="210" y="84" text-anchor="middle" dominant-baseline="central">POST /auth/register  {pseudo, email, mdp}</text>

<!-- 2 hash bcrypt -->
<rect x="298" y="96" width="64" height="20" rx="4" fill="var(--color-background-secondary)" stroke="var(--color-border-tertiary)" stroke-width="0.5"/>
<text class="ts" x="330" y="106" text-anchor="middle" dominant-baseline="central">hash bcrypt</text>

<!-- 3 INSERT user credits=20 -->
<line x1="330" y1="122" x2="562" y2="122" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="340" y="111" width="220" height="14" rx="2" fill="var(--color-background-primary)"/>
<text class="ts" x="450" y="118" text-anchor="middle" dominant-baseline="central">INSERT user  (credits = 20)</text>

<!-- 4 user_id retour -->
<line x1="562" y1="138" x2="338" y2="138" stroke="var(--color-border-primary)" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arr)"/>
<rect x="380" y="127" width="100" height="14" rx="2" fill="var(--color-background-primary)"/>
<text class="ts" x="430" y="134" text-anchor="middle" dominant-baseline="central">user_id</text>

<!-- 5 génère JWT -->
<rect x="298" y="146" width="64" height="20" rx="4" fill="var(--color-background-secondary)" stroke="var(--color-border-tertiary)" stroke-width="0.5"/>
<text class="ts" x="330" y="156" text-anchor="middle" dominant-baseline="central">génère JWT</text>

<!-- 6 201 + token -->
<line x1="322" y1="172" x2="98" y2="172" stroke="var(--color-border-primary)" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arr)"/>
<rect x="108" y="161" width="202" height="14" rx="2" fill="var(--color-background-primary)"/>
<text class="ts" x="209" y="168" text-anchor="middle" dominant-baseline="central">201  {token, user, credits: 20}</text>

<!-- 7 stocke token -->
<rect x="46" y="180" width="88" height="20" rx="4" fill="var(--color-background-secondary)" stroke="var(--color-border-tertiary)" stroke-width="0.5"/>
<text class="ts" x="90" y="190" text-anchor="middle" dominant-baseline="central">localStorage token</text>

<!-- ── CONNEXION ── -->
<line x1="8" y1="212" x2="672" y2="212" stroke="var(--color-border-tertiary)" stroke-width="0.5" stroke-dasharray="2 4"/>
<rect x="8" y="218" width="64" height="16" rx="3" fill="var(--color-background-secondary)" stroke="var(--color-border-tertiary)" stroke-width="0.5"/>
<text class="ts" x="40" y="226" text-anchor="middle" dominant-baseline="central" style="fill:var(--color-text-tertiary)">Connexion</text>

<!-- 1 POST /auth/login -->
<line x1="90" y1="248" x2="322" y2="248" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="100" y="237" width="210" height="14" rx="2" fill="var(--color-background-primary)"/>
<text class="ts" x="205" y="244" text-anchor="middle" dominant-baseline="central">POST /auth/login  {email, mdp}</text>

<!-- 2 SELECT user -->
<line x1="330" y1="264" x2="562" y2="264" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="340" y="253" width="210" height="14" rx="2" fill="var(--color-background-primary)"/>
<text class="ts" x="445" y="260" text-anchor="middle" dominant-baseline="central">SELECT user WHERE email = ?</text>

<!-- 3 user row -->
<line x1="562" y1="280" x2="338" y2="280" stroke="var(--color-border-primary)" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arr)"/>
<rect x="390" y="269" width="80" height="14" rx="2" fill="var(--color-background-primary)"/>
<text class="ts" x="430" y="276" text-anchor="middle" dominant-baseline="central">user row</text>

<!-- 4 bcrypt.compare -->
<rect x="298" y="288" width="64" height="20" rx="4" fill="var(--color-background-secondary)" stroke="var(--color-border-tertiary)" stroke-width="0.5"/>
<text class="ts" x="330" y="298" text-anchor="middle" dominant-baseline="central">bcrypt compare</text>

<!-- alt box -->
<rect x="270" y="314" width="20" height="14" rx="3" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="0.5"/>
<text class="ts" x="280" y="321" text-anchor="middle" dominant-baseline="central">alt</text>
<line x1="270" y1="314" x2="660" y2="314" stroke="var(--color-border-tertiary)" stroke-width="0.5"/>
<line x1="270" y1="350" x2="660" y2="350" stroke="var(--color-border-tertiary)" stroke-width="0.5" stroke-dasharray="3 3"/>
<line x1="270" y1="390" x2="660" y2="390" stroke="var(--color-border-tertiary)" stroke-width="0.5"/>
<line x1="270" y1="314" x2="270" y2="390" stroke="var(--color-border-tertiary)" stroke-width="0.5"/>
<line x1="660" y1="314" x2="660" y2="390" stroke="var(--color-border-tertiary)" stroke-width="0.5"/>

<text class="ts" x="296" y="328" style="fill:var(--color-text-tertiary)">[mdp valide]</text>
<line x1="322" y1="338" x2="98" y2="338" stroke="var(--color-border-primary)" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arr)"/>
<rect x="108" y="327" width="202" height="14" rx="2" fill="var(--color-background-primary)"/>
<text class="ts" x="209" y="334" text-anchor="middle" dominant-baseline="central">200  {token, role, credits}</text>

<text class="ts" x="296" y="364" style="fill:var(--color-text-tertiary)">[mdp invalide]</text>
<line x1="322" y1="374" x2="98" y2="374" stroke="#E24B4A" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arr)"/>
<rect x="108" y="363" width="202" height="14" rx="2" fill="var(--color-background-primary)"/>
<text class="ts" x="209" y="370" text-anchor="middle" dominant-baseline="central">401  "Identifiants incorrects"</text>

<!-- Note JWT -->
<rect x="360" y="402" width="290" height="30" rx="4" fill="var(--color-background-secondary)" stroke="var(--color-border-tertiary)" stroke-width="0.5"/>
<text class="ts" x="505" y="414" text-anchor="middle" dominant-baseline="central" style="fill:var(--color-text-secondary)">JWT payload : user_id · role · exp (24 h)</text>
<text class="ts" x="505" y="428" text-anchor="middle" dominant-baseline="central" style="fill:var(--color-text-secondary)">Vérifié par middleware sur chaque route protégée</text>
</svg>

<div class="sd-legend">
  <div class="sd-legend-item"><div class="sd-legend-line req"></div>Requête</div>
  <div class="sd-legend-item"><div class="sd-legend-line res"></div>Réponse</div>
  <div class="sd-legend-item"><div class="sd-legend-line db"></div>Requête BDD</div>

</div>
