
<style>
.sd-wrap{font-family:var(--font-sans);padding:0 0 8px}
.sd-title{font-size:13px;font-weight:500;color:var(--color-text-primary);text-align:center;padding:12px 0 4px}
.sd-legend{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;padding:8px 0 2px}
.sd-legend-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--color-text-secondary)}
.sd-legend-line{width:32px;height:2px}
.sd-legend-line.req{background:#1D9E75}
.sd-legend-line.res{background:transparent;border-top:2px dashed var(--color-border-primary);height:0}
.sd-legend-line.db{background:#BA7517}
.sd-legend-line.front{background:#534AB7;border-top:2px dashed #534AB7;height:0}
</style>
<div class="sd-wrap">
<div class="sd-title">Recherche &amp; filtrage de trajets — US 3 &amp; 4</div>
<svg width="100%" viewBox="0 0 680 420" role="img">
<title>Diagramme de séquence — Recherche de trajets EcoRide</title>
<desc>Flux US3-US4 : recherche SQL avec suggestion de date alternative et filtres côté front-end</desc>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Acteurs : Visiteur=90, API=330, Supabase=580 -->
<g class="c-teal"><rect x="30" y="8" width="120" height="34" rx="6" stroke-width="0.5"/><text class="th" x="90" y="25" text-anchor="middle" dominant-baseline="central">Visiteur</text></g>
<g class="c-purple"><rect x="270" y="8" width="120" height="34" rx="6" stroke-width="0.5"/><text class="th" x="330" y="25" text-anchor="middle" dominant-baseline="central">API Express</text></g>
<g class="c-amber"><rect x="510" y="8" width="150" height="34" rx="6" stroke-width="0.5"/><text class="th" x="585" y="25" text-anchor="middle" dominant-baseline="central">Supabase (PG)</text></g>

<!-- Lifelines -->
<line x1="90"  y1="42" x2="90"  y2="410" stroke="var(--color-border-secondary)" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="330" y1="42" x2="330" y2="410" stroke="var(--color-border-secondary)" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="585" y1="42" x2="585" y2="410" stroke="var(--color-border-secondary)" stroke-width="1" stroke-dasharray="4 3"/>

<!-- 1 GET /trips -->
<line x1="90" y1="72" x2="322" y2="72" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="95" y="61" width="225" height="14" rx="2" fill="var(--color-background-primary)"/>
<text class="ts" x="207" y="68" text-anchor="middle" dominant-baseline="central">GET /trips?from=Lyon&amp;to=Paris&amp;date=…</text>

<!-- 2 SELECT trips -->
<line x1="330" y1="90" x2="577" y2="90" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="335" y="79" width="240" height="14" rx="2" fill="var(--color-background-primary)"/>
<text class="ts" x="455" y="86" text-anchor="middle" dominant-baseline="central">SELECT trips JOIN car, user  WHERE city + date + seats &gt; 0</text>

<!-- alt box -->
<rect x="270" y="106" width="20" height="14" rx="3" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="0.5"/>
<text class="ts" x="280" y="113" text-anchor="middle" dominant-baseline="central">alt</text>
<line x1="270" y1="106" x2="660" y2="106" stroke="var(--color-border-tertiary)" stroke-width="0.5"/>
<line x1="270" y1="178" x2="660" y2="178" stroke="var(--color-border-tertiary)" stroke-width="0.5" stroke-dasharray="3 3"/>
<line x1="270" y1="252" x2="660" y2="252" stroke="var(--color-border-tertiary)" stroke-width="0.5"/>
<line x1="270" y1="106" x2="270" y2="252" stroke="var(--color-border-tertiary)" stroke-width="0.5"/>
<line x1="660" y1="106" x2="660" y2="252" stroke="var(--color-border-tertiary)" stroke-width="0.5"/>

<!-- Branche 1 : résultats trouvés -->
<text class="ts" x="296" y="122" style="fill:var(--color-text-tertiary)">[résultats trouvés]</text>
<line x1="577" y1="133" x2="338" y2="133" stroke="var(--color-border-primary)" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arr)"/>
<rect x="345" y="122" width="225" height="14" rx="2" fill="var(--color-background-primary)"/>
<text class="ts" x="457" y="129" text-anchor="middle" dominant-baseline="central">rows[]  trip + chauffeur + voiture</text>

<line x1="322" y1="152" x2="98" y2="152" stroke="var(--color-border-primary)" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arr)"/>
<rect x="103" y="141" width="215" height="14" rx="2" fill="var(--color-background-primary)"/>
<text class="ts" x="210" y="148" text-anchor="middle" dominant-baseline="central">200  {trips: […], isEco: energy=électrique}</text>

<!-- Branche 2 : aucun résultat -->
<text class="ts" x="296" y="192" style="fill:var(--color-text-tertiary)">[aucun résultat sur cette date]</text>
<line x1="330" y1="204" x2="577" y2="204" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="335" y="193" width="240" height="14" rx="2" fill="var(--color-background-primary)"/>
<text class="ts" x="455" y="200" text-anchor="middle" dominant-baseline="central">SELECT trip WHERE date &gt; now  ORDER BY date  LIMIT 1</text>

<line x1="577" y1="220" x2="338" y2="220" stroke="var(--color-border-primary)" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arr)"/>
<rect x="400" y="209" width="130" height="14" rx="2" fill="var(--color-background-primary)"/>
<text class="ts" x="465" y="216" text-anchor="middle" dominant-baseline="central">nearest_date</text>

<line x1="322" y1="238" x2="98" y2="238" stroke="var(--color-border-primary)" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arr)"/>
<rect x="103" y="227" width="215" height="14" rx="2" fill="var(--color-background-primary)"/>
<text class="ts" x="210" y="234" text-anchor="middle" dominant-baseline="central">200  {trips:[], suggestedDate: "2025-06-18"}</text>

<!-- Filtres front-end -->
<line x1="8" y1="264" x2="672" y2="264" stroke="var(--color-border-tertiary)" stroke-width="0.5" stroke-dasharray="2 4"/>
<rect x="8" y="270" width="118" height="16" rx="3" fill="var(--color-background-secondary)" stroke="var(--color-border-tertiary)" stroke-width="0.5"/>
<text class="ts" x="67" y="278" text-anchor="middle" dominant-baseline="central" style="fill:var(--color-text-tertiary)">Filtres — côté front</text>

<rect x="30" y="294" width="120" height="90" rx="6" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="0.5"/>
<text class="ts" x="90" y="312" text-anchor="middle" dominant-baseline="central" style="font-weight:500">Filtre React state</text>
<text class="ts" x="90" y="330" text-anchor="middle" dominant-baseline="central">écologique (energy)</text>
<text class="ts" x="90" y="347" text-anchor="middle" dominant-baseline="central">prix maximum</text>
<text class="ts" x="90" y="364" text-anchor="middle" dominant-baseline="central">durée / note min.</text>

<text class="ts" x="200" y="312" style="fill:var(--color-text-secondary)">Appliqués en mémoire sur les données</text>
<text class="ts" x="200" y="328" style="fill:var(--color-text-secondary)">déjà reçues de l'API. Aucun aller-retour</text>
<text class="ts" x="200" y="344" style="fill:var(--color-text-secondary)">serveur supplémentaire.</text>
<text class="ts" x="200" y="365" style="fill:var(--color-text-tertiary)">isEco = energy_type === "électrique"</text>

<!-- Note -->
<rect x="30" y="394" width="620" height="18" rx="4" fill="var(--color-background-secondary)" stroke="var(--color-border-tertiary)" stroke-width="0.5"/>
<text class="ts" x="340" y="403" text-anchor="middle" dominant-baseline="central" style="fill:var(--color-text-secondary)">La recherche se base sur la ville (ILIKE) et la date exacte · Seuls les trajets avec seats &gt; 0 sont retournés</text>
</svg>

<div class="sd-legend">
  <div class="sd-legend-item"><div class="sd-legend-line req"></div>Requête HTTP</div>
  <div class="sd-legend-item"><div class="sd-legend-line res"></div>Réponse HTTP</div>
  <div class="sd-legend-item"><div class="sd-legend-line db"></div>Requête BDD</div>
  <div class="sd-legend-item"><div class="sd-legend-line front"></div>Traitement front-end</div>
</div>
</div>
