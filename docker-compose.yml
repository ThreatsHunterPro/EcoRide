services:
  backend:
    build:
      context: ./BackEnd
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    env_file:
      - ./BackEnd/.env
    volumes:
      - ./BackEnd:/app
      - /app/node_modules 

  frontend:
    build:
      context: ./FrontEnd
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend
    env_file:
      - ./FrontEnd/.env.development
    volumes:
      - ./FrontEnd:/app
      - /app/node_modules